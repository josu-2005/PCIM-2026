<!DOCTYPE html>
<html>
<head>
    <title>Test Cámara</title>
    <style>
        body { margin: 0; padding: 20px; background: #333; }
        .container { max-width: 500px; margin: 0 auto; }
        video { width: 100%; border: 4px solid #ff7a00; border-radius: 20px; }
        button { 
            padding: 15px; 
            margin: 10px; 
            background: #ff7a00; 
            border: none; 
            border-radius: 10px;
            font-family: Arial;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: white;">Test de Cámara</h2>
        <video id="video" autoplay playsinline></video>
        <div>
            <button onclick="iniciarCamara()">Iniciar Cámara</button>
            <button onclick="detenerCamara()">Detener</button>
        </div>
    </div>

    <script>
        let stream = null;

        async function iniciarCamara() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;
                console.log("✅ Cámara funcionando!");
            } catch (error) {
                console.error("❌ Error:", error);
                alert("Error: " + error.message);
            }
        }

        function detenerCamara() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                document.getElementById('video').srcObject = null;
                console.log("Cámara detenida");
            }
        }
    </script>
</body>
</html>
